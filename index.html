<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>APU MUSIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0f3d; --bg2:#2a1659; --card:#ffffff12; --card2:#ffffff1f;
  --pink:#ff4d8d; --amber:#ffb23e; --mist:#efeaff; --dim:#b7aedc;
  --grad:linear-gradient(135deg,#ff4d8d,#ff8a4c 55%,#ffb23e);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Hind Siliguri','Sora',system-ui,sans-serif;color:var(--mist);
  background:radial-gradient(900px 500px at 85% -10%,#5b2bb5 0,transparent 60%),
             radial-gradient(700px 500px at -10% 30%,#7a1f6e55 0,transparent 60%),var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:12px;padding:18px 0 8px}
header svg{width:48px;height:48px;flex:none;filter:drop-shadow(0 6px 14px #ff4d8d66)}
.brand{font-family:'Sora',sans-serif;font-weight:800;font-size:24px;letter-spacing:.04em;line-height:1}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:13px;color:var(--dim);margin-top:4px}
.search{display:flex;gap:8px;margin:14px 0 10px;background:var(--card2);border:1px solid #ffffff22;border-radius:999px;padding:6px 6px 6px 18px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--mist);font:inherit;font-size:16px}
.search input::placeholder{color:var(--dim)}
.search button{border:0;border-radius:999px;padding:10px 20px;font:600 15px 'Hind Siliguri';color:#fff;background:var(--grad);cursor:pointer}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{border:1px solid #ffffff2a;background:transparent;color:var(--dim);border-radius:999px;padding:7px 14px;font:500 14px 'Hind Siliguri';cursor:pointer}
.tab.on{background:var(--mist);color:#2a1659;border-color:var(--mist)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:12px;padding:8px 14px;font:500 14px 'Hind Siliguri';color:var(--mist);background:var(--card);cursor:pointer}
.chip:hover{background:var(--card2)}
h2{font-family:'Sora','Hind Siliguri',sans-serif;font-size:18px;margin:10px 0 10px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer;background:transparent;transition:background .15s}
.row:hover{background:var(--card)}
.row.on{background:var(--card2);box-shadow:inset 3px 0 0 var(--pink)}
.art{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg2)}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{font:500 13px 'Sora',sans-serif;color:var(--dim)}
.badge{font-size:11px;border:1px solid #ffffff33;border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--amber)}
.msg{padding:40px 10px;text-align:center;color:var(--dim)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--pink);margin:0 auto 10px;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;margin-right:2px}
.row.on.playing .eq{display:flex}
.eq i{width:3px;background:var(--pink);border-radius:2px;animation:e .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes e{0%,100%{height:3px}50%{height:14px}}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:#1a0f3dee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #ffffff22}
.pin{max-width:860px;margin:0 auto}
.now{display:flex;align-items:center;gap:12px}
.now .art{width:48px;height:48px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 4px}
.ib{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:var(--mist);cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--card)}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.on{color:var(--amber)}
.play{width:54px;height:54px;background:var(--grad);color:#fff;box-shadow:0 6px 18px #ff4d8d55}
.play:hover{background:var(--grad);filter:brightness(1.1)}
.bar{display:flex;align-items:center;gap:10px;font:500 12px 'Sora',sans-serif;color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;outline:0;cursor:pointer;
  background:linear-gradient(90deg,var(--pink) var(--p,0%),#ffffff2e var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (min-width:700px){.vol{display:block!important}}
.vol{display:none;width:90px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <!-- APU MUSIC logo -->
    <svg viewBox="0 0 64 64" aria-label="APU MUSIC logo">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff4d8d"/><stop offset=".55" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffb23e"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="18" fill="url(#g)"/>
      <path d="M13 34a19 19 0 0 1 38 0" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="9" y="32" width="8" height="15" rx="4" fill="#2a1659"/>
      <rect x="47" y="32" width="8" height="15" rx="4" fill="#2a1659"/>
      <path d="M22 50 32 20 42 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="27" y="38" width="3" height="8" rx="1.5" fill="#fff"/>
      <rect x="32.5" y="33" width="3" height="13" rx="1.5" fill="#fff"/>
      <rect x="38" y="40" width="3" height="6" rx="1.5" fill="#fff"/>
    </svg>
    <div>
      <div class="brand">APU <span>MUSIC</span></div>
      <div class="tag">যে গান খুঁজবেন, সেটাই শুনুন</div>
    </div>
  </header>

  <form class="search" id="f">
    <input id="q" type="search" placeholder="গান, শিল্পী বা অ্যালবাম খুঁজুন…" autocomplete="off" aria-label="সার্চ">
    <button type="submit">খুঁজুন</button>
  </form>

  <div class="tabs" role="tablist">
    <button class="tab on" data-src="audius" type="button">পূর্ণ গান</button>
    <button class="tab" data-src="itunes" type="button">জনপ্রিয় গান (৩০ সেকেন্ড)</button>
  </div>

  <div class="chips" id="chips"></div>
  <h2 id="h">ট্রেন্ডিং এখন</h2>
  <div class="list" id="list"></div>
</div>

<div class="player">
  <div class="pin">
    <div class="now">
      <img class="art" id="pArt" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
      <div class="meta"><div class="t" id="pT">কোনো গান বাছাই করা হয়নি</div><div class="a" id="pA">একটি গান চালু করুন</div></div>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="ভলিউম">
    </div>
    <div class="bar">
      <span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="সময়"><span id="dur">0:00</span>
    </div>
    <div class="ctrl">
      <button class="ib" id="shuf" title="শাফল" aria-label="শাফল"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4 4-1.4-1.4 4-4L17 3zM3 7h3.5c1.3 0 2.5.6 3.3 1.6l5.9 7.3c.4.6 1.1.9 1.8.9h2l-1.5-1.5L18.4 14 21 16.6 18.4 19.2 17 17.8l1.5-1.5h-2c-1.3 0-2.5-.6-3.3-1.6L7.3 9.4C6.9 8.8 6.2 8.5 5.5 8.5H3V7zm0 9.5h2.5c.7 0 1.4-.3 1.8-.9L8.5 14l1.2 1.5-1.2 1.5a4.3 4.3 0 0 1-3 1.5H3v-2z"/></svg></button>
      <button class="ib" id="prev" aria-label="আগের গান"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button class="ib play" id="pp" aria-label="চালান / থামান"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="next" aria-label="পরের গান"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="ib" id="rep" title="রিপিট" aria-label="রিপিট"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
  </div>
</div>

<audio id="au" preload="auto" playsinline></audio>

<script>
const $=s=>document.querySelector(s);
const au=$('#au'), list=$('#list'), APP='APU_MUSIC';
const AUD='https://api.audius.co/v1';
const ICON_PLAY='<path d="M8 5v14l11-7z"/>', ICON_PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
let src='audius', tracks=[], idx=-1, shuffle=false, repeat=false, seeking=false;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fill=el=>el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min||1)*100)+'%');

/* genre chips */
['বাংলা গান','Arijit Singh','Hindi','Lo-fi','Pop','Rock','Hip Hop','Chill','Classical','Electronic','Beyond','Coke Studio'].forEach(g=>{
  const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=g;
  b.onclick=()=>{$('#q').value=g;search(g)};$('#chips').append(b);
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  src=t.dataset.src; const q=$('#q').value.trim(); q?search(q):home();
});
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();q?search(q):home();$('#q').blur()};

/* data */
const norm={
  audius:d=>d.filter(t=>t.is_streamable!==false).map(t=>({
    id:'a'+t.id,title:t.title,artist:t.user?.name||'',dur:t.duration,
    art:t.artwork?.['480x480']||t.artwork?.['150x150']||'',
    url:`${AUD}/tracks/${t.id}/stream?app_name=${APP}`,full:true})),
  itunes:d=>d.filter(t=>t.previewUrl).map(t=>({
    id:'i'+t.trackId,title:t.trackName,artist:t.artistName,dur:30,
    art:(t.artworkUrl100||'').replace('100x100','400x400'),url:t.previewUrl,full:false}))
};
async function load(kind,q){
  if(kind==='audius'){
    const u=q?`${AUD}/tracks/search?query=${encodeURIComponent(q)}&limit=40&app_name=${APP}`
             :`${AUD}/tracks/trending?limit=40&app_name=${APP}`;
    const r=await fetch(u);if(!r.ok)throw 0;return norm.audius((await r.json()).data||[]);
  }
  const term=q||'top hits';
  const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=40`);
  if(!r.ok)throw 0;return norm.itunes((await r.json()).results||[]);
}
function loading(){list.innerHTML='<div class="msg"><div class="spin"></div>লোড হচ্ছে…</div>'}
async function run(q){
  loading();
  try{
    tracks=await load(src,q);
    if(!tracks.length){list.innerHTML='<div class="msg">কোনো গান পাওয়া যায়নি। অন্য নাম লিখে খুঁজুন, অথবা উপরের “জনপ্রিয় গান” ট্যাব চেষ্টা করুন।</div>';return}
    render();
  }catch(e){list.innerHTML='<div class="msg">ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।</div>'}
}
function home(){$('#h').textContent=src==='audius'?'ট্রেন্ডিং এখন':'টপ হিটস';run('')}
function search(q){$('#h').textContent='“'+q+'” এর ফলাফল';run(q)}

function render(){
  list.innerHTML=tracks.map((t,i)=>`
   <div class="row" data-i="${i}" tabindex="0" role="button" aria-label="${esc(t.title)} চালান">
     <img class="art" loading="lazy" alt="" src="${esc(t.art)}" onerror="this.style.visibility='hidden'">
     <div class="meta"><div class="t">${esc(t.title)}${t.full?'':'<span class="badge">প্রিভিউ</span>'}</div><div class="a">${esc(t.artist)}</div></div>
     <div class="eq"><i></i><i></i><i></i></div><div class="d">${fmt(t.dur)}</div>
   </div>`).join('');
  mark();
}
list.onclick=e=>{const r=e.target.closest('.row');if(r)playAt(+r.dataset.i)};
list.onkeydown=e=>{if(e.key==='Enter'){const r=e.target.closest('.row');if(r)playAt(+r.dataset.i)}};
function mark(){
  const cur=tracks[idx];
  list.querySelectorAll('.row').forEach((r,i)=>{r.classList.toggle('on',!!cur&&tracks[i].id===cur.id)});
  list.classList.toggle('playing',!au.paused);
  list.querySelectorAll('.row').forEach(r=>r.classList.toggle('playing',!au.paused));
}

/* playback */
function playAt(i){
  if(i<0||i>=tracks.length)return;
  idx=i;const t=tracks[i];
  au.src=t.url;
  au.play().catch(()=>{});
  $('#pT').textContent=t.title;$('#pA').textContent=t.artist;
  if(t.art)$('#pArt').src=t.art;
  setMedia(t);mark();
}
function nextIdx(dir){
  if(shuffle&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===idx);return n}
  let n=idx+dir;if(n>=tracks.length)n=0;if(n<0)n=tracks.length-1;return n;
}
const nextT=()=>playAt(nextIdx(1)), prevT=()=>{if(au.currentTime>4)au.currentTime=0;else playAt(nextIdx(-1))};
function toggle(){if(idx<0){if(tracks.length)playAt(0);return}au.paused?au.play():au.pause()}
$('#pp').onclick=toggle;$('#next').onclick=nextT;$('#prev').onclick=prevT;
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('#rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat)};
$('#vol').oninput=e=>{au.volume=+e.target.value;fill(e.target)};
fill($('#vol'));

au.onplay=au.onpause=()=>{
  $('#ppi').innerHTML=au.paused?ICON_PLAY:ICON_PAUSE;mark();
  if('mediaSession' in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing';
};
au.onended=()=>{if(repeat){au.currentTime=0;au.play()}else nextT()};
au.onerror=()=>{if(idx>=0&&tracks.length>1)setTimeout(nextT,600)};   // skip unplayable track
au.onloadedmetadata=()=>{$('#dur').textContent=fmt(au.duration)};
au.ontimeupdate=()=>{
  if(seeking||!isFinite(au.duration))return;
  $('#cur').textContent=fmt(au.currentTime);
  $('#seek').value=au.currentTime/au.duration*100;fill($('#seek'));
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState){
    try{navigator.mediaSession.setPositionState({duration:au.duration,playbackRate:1,position:au.currentTime})}catch(e){}
  }
};
const sk=$('#seek');
sk.oninput=()=>{seeking=true;fill(sk);$('#cur').textContent=fmt(sk.value/100*au.duration)};
sk.onchange=()=>{if(isFinite(au.duration))au.currentTime=sk.value/100*au.duration;seeking=false};

/* background / lock-screen playback controls */
function setMedia(t){
  if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:t.title,artist:t.artist,album:'APU MUSIC',
    artwork:t.art?[{src:t.art,sizes:'512x512',type:'image/jpeg'}]:[]});
}
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>au.play());
  m.setActionHandler('pause',()=>au.pause());
  m.setActionHandler('previoustrack',prevT);
  m.setActionHandler('nexttrack',nextT);
  m.setActionHandler('seekto',d=>{if(d.seekTime!=null)au.currentTime=d.seekTime});
  m.setActionHandler('seekbackward',()=>au.currentTime=Math.max(0,au.currentTime-10));
  m.setActionHandler('seekforward',()=>au.currentTime=Math.min(au.duration||0,au.currentTime+10));
}
/* if the browser pauses audio when the screen locks, resume when the page returns */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&idx>=0&&au.paused&&au._wasPlaying)au.play().catch(()=>{});
  au._wasPlaying=false;
});
au.addEventListener('pause',()=>{au._wasPlaying=document.visibilityState==='hidden'});

home();
</script>
</body>
</html>
